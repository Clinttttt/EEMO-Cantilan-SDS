name: Database backup (AWS operator handoff)
# AWS PostgreSQL 18 lives on Lightsail, not Azure Flexible Server.
# The live host owns daily stalltrack-db-backup.timer and the isolated restore drill.
# This manual workflow FAILS CLOSED: success here must never imply an AWS backup exists.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aws-backup:
    name: AWS backup needs verified host access
    runs-on: ubuntu-latest
    steps:
      - name: Explain the backup handoff
        shell: bash
        run: |
          {
            echo '## AWS backup not executed by GitHub'
            echo 'The Azure PostgreSQL dump and firewall commands have been retired.'
            echo 'Check AWS Lightsail systemd timer stalltrack-db-backup.timer.'
            echo 'Confirm a nonempty PostgreSQL 18 custom-format dump, checksum and off-host copy.'
            echo 'Confirm an isolated restore using stalltrack-db-restore-drill.timer.'
            echo 'Do not trust this workflow as backup proof or restore into the live database.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=AWS backup not performed::Run and verify the authorized AWS backup procedure; this workflow does not create a dump.'
          exit 1
