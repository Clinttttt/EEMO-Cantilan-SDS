name: Backup freshness (AWS evidence required)
# The old watchdog queried Azure-oriented backup.yml artifact history.
# It cannot measure AWS Lightsail backup timers and must not report a false green.
# On-host backup and restore-drill timers continue independently of GitHub.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aws-freshness:
    name: Report AWS backup telemetry not yet connected
    runs-on: ubuntu-latest
    steps:
      - name: Require authentic AWS backup evidence
        run: |
          {
            echo '## AWS backup freshness not verified'
            echo 'This GitHub workflow has no authenticated access to Lightsail backup artifacts.'
            echo 'Verify stalltrack-db-backup.timer and stalltrack-db-restore-drill.timer on AWS.'
            echo 'Scheduled off-host freshness alerting must be separately connected and tested.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::warning title=Telemetry required::No false claim that AWS backup is recent.'
          exit 1
