name: Database restore

# DANGER: replaces the production database with the most recent successful backup.
#
# Triggered ONLY on demand (workflow_dispatch), and in the app only after a Head re-enters
# their password AND types the RESTORE confirmation phrase (verified server-side).
#
# SAFETY DESIGN
#   1. Stops the API first, so nothing writes while the database is being replaced — and so the pre-restore
#      snapshot below is actually the state being replaced. Restarted unconditionally at the end.
#   2. Takes a fresh "pre-restore" pg_dump as an artifact — so the exact state before the restore is always
#      recoverable if anything goes wrong.
#   3. Closes any remaining sessions, because a transactional --clean cannot run alongside them.
#   4. Restores inside a SINGLE TRANSACTION (--single-transaction --exit-on-error): if any part fails, the
#      whole restore rolls back and the database is left unchanged.
#   5. Uses the same temporary single-IP firewall pattern as the backup workflow, always removed.
#
# The API is down for the duration — a minute or two. That is the point: a restore is a maintenance action,
# and the alternative is collections taken during it being silently discarded.

on:
  workflow_dispatch:
    inputs:
      target_database:
        description: 'Database to restore INTO. Leave empty for production. Give a name to rehearse.'
        required: false
        default: ''

# NOTE ON THE INPUT ABOVE
#   It must stay optional with an empty default. The portal dispatches this workflow with a ref and no
#   inputs at all (GitHubActionsBackupService), so making it required would break the emergency path the
#   office actually uses - which would be a fine way to discover that the safety net had been welded shut.
#
#   Empty means production, so nothing about the real restore changes. Supply a name and the same steps run
#   against a scratch database instead, which is what makes this procedure practisable. It had never been
#   executed once, and the reason was simply that there was no way to try it without dropping the live
#   database. See scripts/restore-drill.ps1 for the offline drill that proves the DUMP restores; this
#   rehearses the WORKFLOW.

permissions:
  contents: read
  id-token: write      # Azure OIDC
  actions: read        # download the latest backup artifact via gh

concurrency:
  group: database-restore
  cancel-in-progress: false

env:
  RESOURCE_GROUP: stalltrack-prod-rg

jobs:
  restore:
    name: safety-backup then restore latest
    runs-on: ubuntu-latest
    environment: production          # OIDC subject match (same as backup/deploy)

    steps:
      - name: Decide which database is being restored
        id: target
        # Settled once, up front, and printed - so the log says plainly whether this run touched
        # production or a rehearsal copy. Nobody should have to infer that from the steps below.
        env:
          PRODUCTION_DB: ${{ secrets.PG_DATABASE }}
          REQUESTED: ${{ inputs.target_database }}
        run: |
          set -euo pipefail
          if [ -z "${REQUESTED:-}" ] || [ "$REQUESTED" = "$PRODUCTION_DB" ]; then
            echo "db=$PRODUCTION_DB" >> "$GITHUB_OUTPUT"
            echo "is_drill=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Restoring PRODUCTION::This run replaces the contents of $PRODUCTION_DB."
            echo "### Restoring PRODUCTION (\`$PRODUCTION_DB\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "db=$REQUESTED" >> "$GITHUB_OUTPUT"
            echo "is_drill=true" >> "$GITHUB_OUTPUT"
            echo "Rehearsal: restoring into $REQUESTED. Production ($PRODUCTION_DB) is not written to."
            echo "### Rehearsal - restoring into \`$REQUESTED\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Production (\`$PRODUCTION_DB\`) is read for the safety dump and never written to." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install PostgreSQL client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Detect runner public IP
        id: ip
        run: echo "ip=$(curl -fsSL https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Open a temporary firewall rule for this runner
        run: |
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "${{ vars.PG_SERVER_NAME }}" \
            --name "ghrestore-${GITHUB_RUN_ID}" \
            --start-ip-address "${{ steps.ip.outputs.ip }}" \
            --end-ip-address "${{ steps.ip.outputs.ip }}"

      - name: Stop the API so nothing writes during the restore
        if: steps.target.outputs.is_drill == 'false'
        env:
          API_APP_NAME: stalltrack-api-cly-2026
        # WHY
        #   The API is the only thing that writes to this database — the portal and the collectors' app both
        #   go through it. Left running, it accepts collections and receipts while the restore is replacing
        #   the very rows they land in, and those writes are lost without anyone being told. An office that
        #   restores a backup at 9am and takes payments at 9:01 would find the 9:01 receipts gone.
        #
        #   Stopping it also fixes the problem this file already warned about: "active connections can block
        #   the transactional --clean". The API holds a pool open, so the drop-and-recreate could fail on a
        #   busy morning for no reason the office could see.
        #
        #   The PORTAL is deliberately left running. It writes nothing, and a Head who has just triggered a
        #   restore should see a site reporting trouble rather than a dead one; it recovers by itself when the
        #   API returns. The restart below is if: always(), so a failed restore cannot leave the API stopped.
        run: |
          set -euo pipefail
          az webapp stop --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME"
          echo "API stopped. Waiting for its connections to drain..."
          sleep 15
          echo "::notice title=API stopped::The API is down for the duration of the restore."

      - name: Safety backup BEFORE restoring (pre-restore snapshot)
        env:
          PGHOST: ${{ secrets.PG_HOST }}
          PGDATABASE: ${{ secrets.PG_DATABASE }}
          PGUSER: ${{ secrets.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGSSLMODE: require
        # Taken AFTER the API is stopped, deliberately. A snapshot captured while writes were still arriving
        # would not be the state the restore replaces, so the one artifact meant to undo this run would be
        # missing whatever landed in between.
        run: |
          STAMP="$(date -u +%Y%m%d-%H%M)"
          FILE="stalltrack-pre-restore-${STAMP}.dump"
          echo "SAFETY_FILE=$FILE" >> "$GITHUB_ENV"
          pg_dump -Fc -Z 6 --no-owner --no-privileges -f "$FILE"
          ls -lh "$FILE"

      - name: Upload pre-restore safety backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFETY_FILE }}
          path: ${{ env.SAFETY_FILE }}
          retention-days: 90
          if-no-files-found: error

      - name: Download the latest successful backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh run list --workflow backup.yml --status completed \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "No successful backup run found to restore from." >&2
            exit 1
          fi
          echo "Restoring from backup run $LATEST"
          rm -rf ./_restore && mkdir -p ./_restore
          gh run download "$LATEST" --dir ./_restore --repo "$GITHUB_REPOSITORY"
          # gh unpacks each artifact into a DIRECTORY named after the artifact (which ends in
          # ".dump"); the real archive is the FILE inside it — match files only, not the directory.
          DUMP=$(find ./_restore -type f -name '*.dump' | head -n1)
          if [ -z "$DUMP" ]; then
            echo "Downloaded backup contained no .dump file." >&2
            exit 1
          fi
          echo "RESTORE_DUMP=$DUMP" >> "$GITHUB_ENV"

      - name: Create the rehearsal database if it does not exist
        # Only on a drill. Connects to the maintenance database to issue CREATE DATABASE, because you
        # cannot create a database from inside the one you are creating. Existing is fine: a rehearsal
        # target is meant to be reused, and the restore below clears it first.
        if: steps.target.outputs.is_drill == 'true'
        env:
          PGHOST: ${{ secrets.PG_HOST }}
          PGDATABASE: postgres
          PGUSER: ${{ secrets.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGSSLMODE: require
          TARGET_DB: ${{ steps.target.outputs.db }}
        run: |
          set -euo pipefail
          EXISTS=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '${TARGET_DB}'")
          if [ "${EXISTS:-}" = "1" ]; then
            echo "Rehearsal database ${TARGET_DB} already exists; it will be cleared by the restore."
          else
            psql -c "CREATE DATABASE \"${TARGET_DB}\""
            echo "Created rehearsal database ${TARGET_DB}."
          fi

      - name: Close any remaining connections to the target
        if: steps.target.outputs.is_drill == 'false'
        env:
          PGHOST: ${{ secrets.PG_HOST }}
          PGDATABASE: ${{ secrets.PG_DATABASE }}
          PGUSER: ${{ secrets.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGSSLMODE: require
        # Stopping the API removes the writer, but a restore has to be the ONLY session on the database: a
        # forgotten psql window or a pgAdmin connection is enough to make the transactional --clean fail, and
        # it fails after the point where the office is already committed to restoring. Our own session is
        # excluded, or this would disconnect the very connection issuing it.
        run: |
          set -euo pipefail
          TERMINATED=$(psql -t -A -c "SELECT count(*) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid();")
          echo "Other sessions on ${PGDATABASE}: ${TERMINATED}"
          psql -q -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid();" > /dev/null
          echo "Closed ${TERMINATED} other session(s) before restoring."

      - name: Restore (atomic — rolls back entirely on any error)
        env:
          PGHOST: ${{ secrets.PG_HOST }}
          # The chosen target, not the production secret: this is the one line that decides whether the
          # run rehearses or replaces the live database.
          PGDATABASE: ${{ steps.target.outputs.db }}
          PGUSER: ${{ secrets.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGSSLMODE: require
        run: |
          echo "Restoring $RESTORE_DUMP into $PGDATABASE"
          pg_restore --no-owner --no-privileges --clean --if-exists \
            --single-transaction --exit-on-error \
            -d "$PGDATABASE" "$RESTORE_DUMP"
          echo "Restore completed successfully."

      - name: Verify what came back
        # The same assertion the offline drill makes: pg_restore can report success having applied very
        # little, and a schema with no tables restores "successfully". Checked here so a restore that
        # silently achieved nothing cannot be reported as a good one.
        env:
          PGHOST: ${{ secrets.PG_HOST }}
          PGDATABASE: ${{ steps.target.outputs.db }}
          PGUSER: ${{ secrets.PG_USER }}
          PGPASSWORD: ${{ secrets.PG_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          TABLES=$(psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          MIGRATIONS=$(psql -tAc 'SELECT count(*) FROM "__EFMigrationsHistory"')
          echo "Tables: $TABLES, migrations applied: $MIGRATIONS"
          {
            echo ""
            echo "| Check | Value |"
            echo "| --- | --- |"
            echo "| Database | \`$PGDATABASE\` |"
            echo "| Tables | $TABLES |"
            echo "| Migrations applied | $MIGRATIONS |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TABLES" -lt 20 ]; then
            echo "::error title=Restore achieved nothing::Only $TABLES tables present after the restore."
            exit 1
          fi

      - name: How to remove the rehearsal database
        if: steps.target.outputs.is_drill == 'true' && always()
        env:
          TARGET_DB: ${{ steps.target.outputs.db }}
        run: |
          {
            echo ""
            echo "Rehearsal copy \`$TARGET_DB\` is left in place so you can inspect it. Drop it when done:"
            echo ""
            echo '```sql'
            echo "DROP DATABASE \"$TARGET_DB\";"
            echo '```'
            echo ""
            echo "It costs storage on the production server until then."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bring the API back
        # if: always() and NOT gated on the drill flag being read successfully — this must run whether the
        # restore succeeded, failed, or the job was cancelled halfway. Leaving the office's API stopped would
        # turn a failed restore into an outage, which is a worse outcome than the one being recovered from.
        # Starting an app that is already running is a no-op, so this is safe on a rehearsal too.
        if: always()
        env:
          API_APP_NAME: stalltrack-api-cly-2026
          API_HEALTH_URL: https://stalltrack-api-cly-2026-axdafcazchhfdvgq.southeastasia-01.azurewebsites.net/health
        run: |
          set -uo pipefail
          az webapp start --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME" || true

          # On a rehearsal the API was never stopped, so its health is not this run's business — asserting it
          # would let an unrelated outage fail a drill and teach the office that drills are unreliable.
          if [ "${{ steps.target.outputs.is_drill }}" = "true" ]; then
            echo "Rehearsal: the API was not stopped, so no health check is asserted."
            exit 0
          fi

          # Reported, not assumed. A restore that finished while the API failed to come back is still an
          # outage, and the office needs to see that here rather than from a vendor's phone call.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null "$API_HEALTH_URL"; then
              echo "::notice title=API is back::The API answered /health after the restore."
              echo "The API is running again." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "API not healthy yet (attempt ${attempt}/30). Waiting 10s..."
            sleep 10
          done

          echo "::error title=API did not come back::The restore finished but the API is not answering /health. Start it from the Azure portal: $API_APP_NAME."
          echo "**The API did not come back on its own — start \`$API_APP_NAME\` in the Azure portal.**" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Remove the temporary firewall rule
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "${{ vars.PG_SERVER_NAME }}" \
            --name "ghrestore-${GITHUB_RUN_ID}" \
            --yes || true

# ─────────────────────────────────────────────────────────────────────────────
# Reuses the SAME repo variable/secrets as backup.yml (PG_SERVER_NAME var; PG_HOST/
# PG_DATABASE/PG_USER/PG_PASSWORD secrets; AZURE_* vars) and the same OIDC firewall role.
# Recovery: if a restore ever goes wrong, download the "stalltrack-pre-restore-*.dump"
# artifact from this run and pg_restore it back.
# ─────────────────────────────────────────────────────────────────────────────
