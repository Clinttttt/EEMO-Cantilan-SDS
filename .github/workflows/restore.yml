name: Database restore (AWS — manual safety hold)
# Retired Azure App Service / PostgreSQL Flexible Server restoration.
# RESTORE MUST NOT overwrite AWS production from a GitHub Actions runner.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-restore
  cancel-in-progress: false
jobs:
  aws-restore-handoff:
    name: Restore disabled until authorized AWS recovery procedure
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unattended restore
        run: |
          {
            echo '## No database restored'
            echo 'The previous Azure restore workflow is retired.'
            echo 'AWS production requires explicit authorization, a verified pre-restore snapshot,'
            echo 'an offline/isolated restoration rehearsal, a maintenance window, and a rollback plan.'
            echo 'No Azure import, database reset, API shutdown, or restore operation was attempted.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error title=Restore disabled::Use the authorized AWS recovery runbook. Database unchanged.'
          exit 1
