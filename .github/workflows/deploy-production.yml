name: Deploy production

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**'
      # Documentation-only commits must not spend a production deployment. The agent-facing knowledge base,
      # the steering rules and the Codex entry point are all documentation.
      - '.kiro/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  RESOURCE_GROUP: stalltrack-prod-rg
  ACR_NAME: stalltrackregistry2026
  ACR_LOGIN_SERVER: stalltrackregistry2026.azurecr.io
  API_APP_NAME: stalltrack-api-cly-2026
  PORTAL_APP_NAME: stalltrack-web-cly-2026
  API_CONTAINER_NAME: stalltrack-api
  PORTAL_CONTAINER_NAME: stalltrack-web
  API_HEALTH_URL: https://stalltrack-api-cly-2026-axdafcazchhfdvgq.southeastasia-01.azurewebsites.net/health
  PORTAL_URL: https://stalltrack-web-cly-2026-etbvg2awawdxhuas.southeastasia-01.azurewebsites.net/login

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore tests
        run: dotnet restore EEMOCantilanSDS.Testing/EEMOCantilanSDS.UnitTest.csproj

      - name: Run unit tests
        run: >-
          dotnet test EEMOCantilanSDS.Testing/EEMOCantilanSDS.UnitTest.csproj
          --configuration Release
          --no-restore

      # The same three suites CI runs. A regression only the rendered-component or database-backed tests can
      # see was previously able to reach production, because this gate ran the unit tests alone.
      - name: Run component tests
        run: >-
          dotnet test EEMOCantilanSDS.ComponentTests/EEMOCantilanSDS.ComponentTests.csproj
          --configuration Release

      - name: Check the container runtime is available
        run: docker version

      - name: Run integration tests
        run: >-
          dotnet test EEMOCantilanSDS.IntegrationTests/EEMOCantilanSDS.IntegrationTests.csproj
          --configuration Release

  backup-gate:
    name: Fresh backup before a schema change
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write          # to start the backup workflow and read its result

    # WHY THIS JOB EXISTS
    #   Migrations are applied on API startup, so a deployment carrying one changes the shape of the
    #   office's data before anyone has a chance to check it. The 7-day point-in-time restore and the daily
    #   dump both exist, but a daily dump can be almost 24 hours old — and on a market day that is a day of
    #   collections. This makes the safety net a PRECONDITION of the risky change rather than a hope.
    #
    # WHY IT IS CONDITIONAL
    #   Most deployments carry no migration at all; today's were entirely code. Demanding a dump for every
    #   one of those would add minutes to every release and teach the office to ignore the gate. The strict
    #   treatment is reserved for the deployments that can actually reshape the database.
    outputs:
      schema_changed: ${{ steps.detect.outputs.schema_changed }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the comparison below needs history, not just the tip

      - name: Does this deployment change the database schema
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # The range that is actually being deployed. On a normal push GitHub gives both ends; on a manual
          # run (or a first push) "before" is absent or all-zeroes, and then the honest answer is "we cannot
          # tell", which is treated as a schema change. Being wrong that way costs one dump; being wrong the
          # other way costs the database.
          BEFORE="${{ github.event.before }}"
          MIGRATIONS_PATH="EEMOCantilanSDS.Infrastructure/Migrations"

          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Cannot determine what changed (manual run, or the previous commit is unavailable)."
            echo "Treating this as a schema change so the backup is taken regardless."
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${GITHUB_SHA}" -- "$MIGRATIONS_PATH" || true)

          if [ -n "$CHANGED" ]; then
            echo "Migration files in this deployment:"
            echo "$CHANGED"
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration files changed between $BEFORE and $GITHUB_SHA."
            echo "schema_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Note that no backup is required
        if: steps.detect.outputs.schema_changed != 'true'
        run: |
          {
            echo "### Backup gate"
            echo ""
            echo "No migration in this deployment, so the daily backup stands and no extra dump was taken."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Take a backup now, and wait for it
        if: steps.detect.outputs.schema_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Deliberately unconditional rather than "only if the last one is older than N hours". A schema
          # change is rare, a dump takes a couple of minutes, and threshold arithmetic is one more thing to
          # get wrong in the job whose whole purpose is to be trustworthy.
          STARTED_AT=$(date -u +%s)
          gh workflow run backup.yml --ref "${GITHUB_REF_NAME}"
          echo "Requested a database backup. Waiting for it to finish..."

          # Find the run this dispatch created. It appears a moment later, so poll for it rather than
          # assuming the newest run is ours.
          RUN_ID=""
          for attempt in $(seq 1 20); do
            sleep 6
            RUN_ID=$(gh run list --workflow=backup.yml --event=workflow_dispatch --limit 10 \
              --json databaseId,createdAt \
              --jq "[.[] | select((.createdAt | fromdateiso8601) >= ${STARTED_AT} - 60)] | sort_by(.createdAt) | last | .databaseId // empty")
            if [ -n "${RUN_ID:-}" ]; then break; fi
            echo "The backup run has not appeared yet (attempt ${attempt}/20)."
          done

          if [ -z "${RUN_ID:-}" ]; then
            echo "::error title=Backup did not start::A backup was requested but no run appeared. Deployment stopped rather than migrating without one."
            exit 1
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          echo "Backup run: ${RUN_URL}"

          # A dump of this database takes a couple of minutes; 20 is generous without hanging a release.
          for attempt in $(seq 1 40); do
            STATUS=$(gh run view "$RUN_ID" --json status,conclusion --jq '.status + "/" + (.conclusion // "")')
            echo "Backup status: ${STATUS} (check ${attempt}/40)"
            case "$STATUS" in
              completed/success)
                {
                  echo "### Backup gate"
                  echo ""
                  echo "This deployment changes the database schema, so a fresh backup was taken first."
                  echo ""
                  echo "- Backup run: ${RUN_URL}"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              completed/*)
                echo "::error title=Backup failed::The pre-deployment backup did not succeed (${STATUS}). See ${RUN_URL}. Deployment stopped rather than migrating without a usable backup."
                exit 1
                ;;
            esac
            sleep 30
          done

          echo "::error title=Backup did not finish::The pre-deployment backup was still running after 20 minutes. See ${RUN_URL}. Deployment stopped rather than migrating on an unverified backup."
          exit 1

  deploy:
    name: Build and deploy production images
    needs: [verify, backup-gate]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stalltrack-web-cly-2026-etbvg2awawdxhuas.southeastasia-01.azurewebsites.net

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push API image
        run: |
          docker build \
            --file EEMOCantilanSDS.Api/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/stalltrack-api:${GITHUB_SHA}" \
            .
          docker push "$ACR_LOGIN_SERVER/stalltrack-api:${GITHUB_SHA}"

      - name: Build and push portal image
        run: |
          docker build \
            --file EEMOCantilanSDS.Client/Dockerfile \
            --tag "$ACR_LOGIN_SERVER/stalltrack-web:${GITHUB_SHA}" \
            .
          docker push "$ACR_LOGIN_SERVER/stalltrack-web:${GITHUB_SHA}"

      - name: Deploy API image
        run: |
          az webapp sitecontainers update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --container-name "$API_CONTAINER_NAME" \
            --image "$ACR_LOGIN_SERVER/stalltrack-api:${GITHUB_SHA}" \
            --target-port 8080
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$API_APP_NAME"

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$API_HEALTH_URL"; then
              exit 0
            fi
            echo "API is not ready yet (attempt $attempt/30). Waiting 10 seconds..."
            sleep 10
          done
          echo "API did not become healthy after 5 minutes. Check the App Service log stream."
          exit 1

      - name: Deploy portal image
        run: |
          az webapp sitecontainers update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$PORTAL_APP_NAME" \
            --container-name "$PORTAL_CONTAINER_NAME" \
            --image "$ACR_LOGIN_SERVER/stalltrack-web:${GITHUB_SHA}" \
            --target-port 8080
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$PORTAL_APP_NAME"

      - name: Wait for portal
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --output /dev/null "$PORTAL_URL"; then
              exit 0
            fi
            echo "Portal is not ready yet (attempt $attempt/30). Waiting 10 seconds..."
            sleep 10
          done
          echo "Portal did not become available after 5 minutes. Check the App Service log stream."
          exit 1
