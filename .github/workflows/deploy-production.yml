name: Deploy production (AWS release verification)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  aws-readiness:
    name: Check AWS endpoints; manual operator cutover required
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://console.stalltrack.site/login
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
      - name: Verify AWS production endpoints read-only
        shell: bash
        run: |
          set -euo pipefail
          for url in https://api.stalltrack.site/health/ready https://console.stalltrack.site/login https://admin.stalltrack.site/ https://payor.stalltrack.site/; do
            curl --fail --silent --show-error --max-time 20 --output /dev/null "$url"
            echo "Reachable: $url"
          done
      - name: Document AWS cutover guard
        shell: bash
        run: |
          {
            echo '## AWS release readiness'
            echo 'The Azure App Service and Azure Container Registry deployment has been retired.'
            echo 'This check does NOT deploy containers or change the database.'
            echo 'An authorized operator must verify AWS backups, migrations and rollback before manual cutover.'
            echo 'Expected database: stalltrack_v10_presentation_clean (PostgreSQL 18).'
            echo 'Use versioned AWS Docker images and existing validated Compose overlays.'
            echo 'Do not apply migrations, reset records, or import Azure data as part of an unattended workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::notice title=AWS manual cutover::No production mutation attempted.'
