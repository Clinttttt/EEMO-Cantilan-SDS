name: Rehearsal database cleanup (AWS — manual safety hold)
# Retired Azure Flexible Server database drop. Never run against AWS presentation DB.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aws-cleanup-handoff:
    name: Database drop disabled in GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Refuse automated database drop
        run: |
          echo '::error title=Database cleanup disabled::Review the AWS rehearsal database and confirm an explicit safe target with an authorized operator.'
          exit 1
