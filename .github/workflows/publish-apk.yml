name: Publish Collector APK

# Manual only — never runs on push/PR, so it can't affect the API/web CI or deploy. Produces a signed
# release APK as a build artifact. Requires the signing secrets below; fails clearly if any are missing.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64      base64 of the release keystore  (base64 -w0 stalltrack-release.keystore)
#   ANDROID_KEYSTORE_PASSWORD    keystore store password
#   ANDROID_KEY_ALIAS            key alias
#   ANDROID_KEY_PASSWORD         key password
#   GOOGLE_SERVICES_JSON_BASE64  base64 of Platforms/Android/google-services.json (untracked; needed to build)
#
# Optional (enables AUTO-PUBLISH of the download PAGE to app.stalltrack.site):
#   AZURE_SWA_DEPLOY_TOKEN       Static Web App deployment token
#     az staticwebapp secrets list -n stalltrack-app-site -g stalltrack-prod-rg --query "properties.apiKey" -o tsv
#
# WHERE THE APK IS SERVED FROM, and why it moved (2026-08-22):
#   The signed APK is attached to a GitHub Release, and the download link points at
#   https://github.com/<owner>/<repo>/releases/latest/download/stalltrack-collector-latest.apk
#   which always resolves to the newest release's asset.
#
#   It used to be deployed as part of the static site and served from app.stalltrack.site/download/. Measured
#   2026-08-22: four of eight full downloads of that 41 MB file returned Azure Static Web Apps' own
#   "500 Internal Server Error" page instead of the file, which is what left collectors with a 0 KB .apk. The
#   file, its content type and its range handling were all correct; the host simply failed on the large body.
#   Static Web Apps is built for small assets. The release CDN is built for binaries, so the site now carries
#   only the page and the APK is never served through it.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Display version, e.g. 1.1.0 (optional; overrides csproj ApplicationDisplayVersion)"
        required: false
        default: ""
      versionCode:
        description: "Android versionCode integer — MUST increase each release (optional; overrides csproj)"
        required: false
        default: ""

# Writing is needed to attach the APK to a release. Nothing else in this workflow writes to the repository.
permissions:
  contents: write

jobs:
  build-apk:
    name: Build & sign Android APK
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_SWA_DEPLOY_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore google-services.json (required for the Android build)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set."; exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > EEMOCantilanSDS.Mobile/Platforms/Android/google-services.json

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stalltrack-release.keystore"

      - name: Publish signed APK
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VNAME: ${{ github.event.inputs.versionName }}
          VCODE: ${{ github.event.inputs.versionCode }}
        run: |
          set -e
          # The version the APK will actually carry: the inputs when given, otherwise the csproj's own values. Resolved
          # here so the release tag below cannot claim a version the build does not carry — which is how
          # collector-1.1.0-2 came to hold an APK reporting versionCode 1, leaving every install announcing an update.
          CSPROJ=EEMOCantilanSDS.Mobile/EEMOCantilanSDS.Mobile.csproj
          CS_VNAME=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' "$CSPROJ" | head -1)
          CS_VCODE=$(sed -n 's:.*<ApplicationVersion>\(.*\)</ApplicationVersion>.*:\1:p' "$CSPROJ" | head -1)
          EFF_VNAME="${VNAME:-$CS_VNAME}"
          EFF_VCODE="${VCODE:-$CS_VCODE}"
          echo "Building version $EFF_VNAME (versionCode $EFF_VCODE)"
          echo "apk_version_name=$EFF_VNAME" >> "$GITHUB_ENV"
          echo "apk_version_code=$EFF_VCODE" >> "$GITHUB_ENV"
          ARGS="-c Release -f net10.0-android \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=$RUNNER_TEMP/stalltrack-release.keystore \
            -p:AndroidSigningStorePass=$STORE_PASS \
            -p:AndroidSigningKeyAlias=$KEY_ALIAS \
            -p:AndroidSigningKeyPass=$KEY_PASS \
            -p:ApplicationDisplayVersion=$EFF_VNAME \
            -p:ApplicationVersion=$EFF_VCODE"
          dotnet publish EEMOCantilanSDS.Mobile/EEMOCantilanSDS.Mobile.csproj $ARGS

      - name: Stage the signed APK
        run: |
          set -e
          mkdir -p dist
          # The asset keeps this exact name so the "latest release" download URL never changes between releases.
          find EEMOCantilanSDS.Mobile/bin/Release/net10.0-android -name "*-Signed.apk" -print \
            -exec cp {} dist/stalltrack-collector-latest.apk \;
          ls -la dist
          test -s dist/stalltrack-collector-latest.apk

      - name: Refresh the seal on the download page
        run: |
          set -e
          mkdir -p mobile-app-site/assets
          cp EEMOCantilanSDS.Mobile/wwwroot/images/stalltrack-seal.png mobile-app-site/assets/seal.png || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stalltrack-collector-apk
          path: dist/stalltrack-collector-latest.apk
          if-no-files-found: error
          retention-days: 90

      # Where collectors actually download from. A release per publish, with the asset under a fixed name, so
      # /releases/latest/download/stalltrack-collector-latest.apk always points at the newest build.
      - name: Attach the APK to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Named from what the build ACTUALLY carries (resolved in the publish step), never from an input that may have
          # been left blank. The tag used to fall back to the run number, so collector-1.1.0-2 could hold an APK
          # reporting versionCode 1 — and the operator, reading the tag, then advertised code 2 to every device.
          TAG="collector-${apk_version_name}-${apk_version_code}"
          SIZE=$(stat -c%s dist/stalltrack-collector-latest.apk)
          echo "Publishing $TAG ($SIZE bytes)"
          # --clobber so re-running the same tag replaces the asset rather than failing halfway.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/stalltrack-collector-latest.apk --clobber
          else
            gh release create "$TAG" dist/stalltrack-collector-latest.apk \
              --title "Collector app ${apk_version_name} (versionCode ${apk_version_code})" \
              --notes "Signed Android APK for the StallTrack Collector app. ${SIZE} bytes.

Set Mobile__LatestVersionCode=${apk_version_code} and Mobile__LatestVersion=${apk_version_name} on the API so installed apps stop being told an update is available." \
              --latest
          fi
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/stalltrack-collector-latest.apk"

      # The download PAGE only. The APK is not deployed here any more: this host returned intermittent 500s on
      # the 41 MB body, which is what produced the 0 KB downloads. Old links keep working through the redirect
      # stated in staticwebapp.config.json.
      - name: Publish the download page to app.stalltrack.site
        if: ${{ env.SWA_TOKEN != '' }}
        run: |
          set -e
          npm install -g @azure/static-web-apps-cli
          swa deploy ./mobile-app-site --deployment-token "$SWA_TOKEN" --env production
          echo "Published the page: https://app.stalltrack.site/"
