<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- Pinch-zoom is deliberately NOT blocked. maximum-scale=1.0 with user-scalable=no was here to stop iOS
         zooming when a field takes focus, but it also stops a collector enlarging anything - a WCAG 2.1 failure
         (1.4.4 Resize Text) and a real problem for a field app read in sunlight by someone who needs larger text.
         The focus-zoom it was guarding against is prevented properly instead, by giving inputs a 16px font size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EEMOCantilanSDS.Mobile</title>
    <base href="/" />
    <link rel="stylesheet" href="/css/site.min.css" asp-append-version="true" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="EEMOCantilanSDS.Mobile.styles.css" />
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/eemo.css" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.scrollElementIntoView = (id) => {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
    </script>

</body>

</html>
